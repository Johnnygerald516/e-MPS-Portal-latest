version: '3.8'

services:
  migrant-fe-portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: 10.6.0.157:30000/migrant-fe-portal:v0.0.5
    container_name: migrant-fe-portal
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      - NODE_ENV=production
      - PORT=3100
      - HOST=0.0.0.0
      # API Configuration
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://10.6.0.168:30033}
      - NEXT_PUBLIC_API_URL_FALLBACK=${NEXT_PUBLIC_API_URL_FALLBACK:-http://10.6.0.168:30033}
      - NEXT_PUBLIC_API_KEY=${NEXT_PUBLIC_API_KEY:-}
      - NEXT_PUBLIC_API_KEY_FALLBACK=${NEXT_PUBLIC_API_KEY_FALLBACK:-}
      # Trusted Hostnames
      - NEXT_PUBLIC_TRUSTED_HOSTNAMES=${NEXT_PUBLIC_TRUSTED_HOSTNAMES:-localhost,127.0.0.1,41.59.104.107,41.59.104.109}
      # Image Domains
      - NEXT_PUBLIC_IMAGE_DOMAINS=${NEXT_PUBLIC_IMAGE_DOMAINS:-41.59.104.109}
    networks:
      - migrant-network

networks:
  migrant-network:
    driver: bridge
