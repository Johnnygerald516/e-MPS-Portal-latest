<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Tractor pattern -->
    <pattern id="tractor" width="120" height="80" patternUnits="userSpaceOnUse">
      <!-- Tractor body -->
      <rect x="40" y="30" width="50" height="20" fill="#FF0000" stroke="#8B0000" stroke-width="1"/>
      <!-- Tractor cabin -->
      <rect x="30" y="15" width="25" height="15" fill="#FF0000" stroke="#8B0000" stroke-width="1"/>
      <!-- Front wheel -->
      <circle cx="30" cy="50" r="10" fill="#000000" stroke="#333333" stroke-width="1"/>
      <circle cx="30" cy="50" r="5" fill="#333333"/>
      <!-- Back wheel -->
      <circle cx="75" cy="50" r="15" fill="#000000" stroke="#333333" stroke-width="1"/>
      <circle cx="75" cy="50" r="7" fill="#333333"/>
      <!-- Exhaust -->
      <rect x="85" y="10" width="5" height="20" fill="#696969" stroke="#333333" stroke-width="1"/>
    </pattern>
    
    <!-- Field lines pattern -->
    <pattern id="field-lines" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M0,50 L200,50 M0,100 L200,100 M0,150 L200,150" stroke="#8B8B00" stroke-width="1" opacity="0.2"/>
    </pattern>
    
    <!-- Crop rows pattern -->
    <pattern id="crop-rows" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="none"/>
      <path d="M10,0 L10,100 M30,0 L30,100 M50,0 L50,100 M70,0 L70,100 M90,0 L90,100" 
            stroke="#228B22" stroke-width="2" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#F5F5DC" opacity="0.3"/>
  
  <!-- Field background -->
  <rect width="800" height="600" fill="url(#field-lines)" opacity="0.3"/>
  <rect width="800" height="600" fill="url(#crop-rows)" opacity="0.3"/>
  
  <!-- Tractors scattered around -->
  <rect x="50" y="50" width="120" height="80" fill="url(#tractor)" opacity="0.8"/>
  <rect x="250" y="100" width="120" height="80" fill="url(#tractor)" opacity="0.8" transform="rotate(15, 310, 140)"/>
  <rect x="450" y="50" width="120" height="80" fill="url(#tractor)" opacity="0.8" transform="rotate(-10, 510, 90)"/>
  <rect x="650" y="100" width="120" height="80" fill="url(#tractor)" opacity="0.8"/>
  
  <rect x="150" y="200" width="120" height="80" fill="url(#tractor)" opacity="0.8" transform="rotate(-15, 210, 240)"/>
  <rect x="350" y="250" width="120" height="80" fill="url(#tractor)" opacity="0.8"/>
  <rect x="550" y="200" width="120" height="80" fill="url(#tractor)" opacity="0.8" transform="rotate(10, 610, 240)"/>
  
  <rect x="50" y="350" width="120" height="80" fill="url(#tractor)" opacity="0.8" transform="rotate(5, 110, 390)"/>
  <rect x="250" y="400" width="120" height="80" fill="url(#tractor)" opacity="0.8"/>
  <rect x="450" y="350" width="120" height="80" fill="url(#tractor)" opacity="0.8" transform="rotate(-5, 510, 390)"/>
  <rect x="650" y="400" width="120" height="80" fill="url(#tractor)" opacity="0.8" transform="rotate(20, 710, 440)"/>
  
  <rect x="150" y="500" width="120" height="80" fill="url(#tractor)" opacity="0.8" transform="rotate(-10, 210, 540)"/>
  <rect x="400" y="500" width="120" height="80" fill="url(#tractor)" opacity="0.8"/>
  <rect x="600" y="500" width="120" height="80" fill="url(#tractor)" opacity="0.8" transform="rotate(5, 660, 540)"/>
</svg>
