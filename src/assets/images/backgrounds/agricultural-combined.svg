<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Farm house pattern -->
    <pattern id="farm-house" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M60,20 L90,40 L90,80 L30,80 L30,40 Z" fill="#8B4513" stroke="#5D2906" stroke-width="2"/>
      <path d="M60,20 L30,40 L90,40 Z" fill="#A52A2A" stroke="#5D2906" stroke-width="2"/>
      <rect x="50" y="60" width="20" height="20" fill="#C19A6B"/>
      <rect x="40" y="50" width="10" height="10" fill="#87CEEB"/>
      <rect x="70" y="50" width="10" height="10" fill="#87CEEB"/>
    </pattern>
    
    <!-- Hoe pattern -->
    <pattern id="hoe" width="60" height="60" patternUnits="userSpaceOnUse">
      <!-- Handle -->
      <path d="M30,10 L30,40" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>
      <!-- Blade -->
      <path d="M20,40 L40,40 L37,47 L23,47 Z" fill="#A9A9A9" stroke="#696969" stroke-width="1"/>
    </pattern>
    
    <!-- Tractor pattern -->
    <pattern id="tractor" width="80" height="60" patternUnits="userSpaceOnUse">
      <!-- Tractor body -->
      <rect x="25" y="20" width="35" height="15" fill="#FF0000" stroke="#8B0000" stroke-width="1"/>
      <!-- Tractor cabin -->
      <rect x="20" y="10" width="15" height="10" fill="#FF0000" stroke="#8B0000" stroke-width="1"/>
      <!-- Front wheel -->
      <circle cx="20" cy="35" r="7" fill="#000000" stroke="#333333" stroke-width="1"/>
      <circle cx="20" cy="35" r="3" fill="#333333"/>
      <!-- Back wheel -->
      <circle cx="50" cy="35" r="10" fill="#000000" stroke="#333333" stroke-width="1"/>
      <circle cx="50" cy="35" r="5" fill="#333333"/>
      <!-- Exhaust -->
      <rect x="55" y="7" width="3" height="13" fill="#696969" stroke="#333333" stroke-width="1"/>
    </pattern>
    
    <!-- Fishing net pattern -->
    <pattern id="fishing-net" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M0,0 L80,0 L80,80 L0,80 Z" fill="none" stroke="#708090" stroke-width="0.5" opacity="0.4"/>
      <path d="M20,0 L20,80 M40,0 L40,80 M60,0 L60,80" stroke="#708090" stroke-width="0.5" opacity="0.4"/>
      <path d="M0,20 L80,20 M0,40 L80,40 M0,60 L80,60" stroke="#708090" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    
    <!-- Fish pattern -->
    <pattern id="fish" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M25,10 C33,7 33,13 25,10 L12,3 C9,5 9,15 12,17 L25,10 Z" fill="#4682B4" stroke="#000000" stroke-width="0.5" opacity="0.5"/>
      <circle cx="28" cy="10" r="1" fill="#000000"/>
    </pattern>
    
    <!-- Wheat crop pattern -->
    <pattern id="wheat" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20,35 L20,15 M17,18 L20,15 L23,18 M15,21 L20,15 L25,21 M14,24 L20,15 L26,24 M17,27 L20,15 L23,27" 
            stroke="#DAA520" stroke-width="1" fill="none"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#F5F5DC" opacity="0.2"/>
  
  <!-- Divide the background into sections for different agricultural elements -->
  <g opacity="0.2">
    <!-- Top left: Farm section -->
    <rect x="0" y="0" width="400" height="300" fill="#E8F5E9"/>
    
    <!-- Top right: Hoes section -->
    <rect x="400" y="0" width="400" height="300" fill="#F1F8E9"/>
    
    <!-- Bottom left: Tractor section -->
    <rect x="0" y="300" width="400" height="300" fill="#FFF8E1"/>
    
    <!-- Bottom right: Fishing section -->
    <rect x="400" y="300" width="400" height="300" fill="#E1F5FE"/>
  </g>
  
  <!-- Farm houses in top left -->
  <g opacity="0.7">
    <rect x="50" y="50" width="120" height="120" fill="url(#farm-house)"/>
    <rect x="200" y="100" width="120" height="120" fill="url(#farm-house)"/>
  </g>
  
  <!-- Wheat in top left -->
  <g opacity="0.6">
    <rect x="100" y="200" width="200" height="40" fill="url(#wheat)"/>
    <rect x="50" y="150" width="100" height="40" fill="url(#wheat)"/>
  </g>
  
  <!-- Hoes in top right -->
  <g opacity="0.7">
    <rect x="420" y="50" width="60" height="60" fill="url(#hoe)"/>
    <rect x="520" y="100" width="60" height="60" fill="url(#hoe)" transform="rotate(30, 550, 130)"/>
    <rect x="620" y="50" width="60" height="60" fill="url(#hoe)" transform="rotate(-15, 650, 80)"/>
    <rect x="470" y="170" width="60" height="60" fill="url(#hoe)" transform="rotate(45, 500, 200)"/>
    <rect x="570" y="200" width="60" height="60" fill="url(#hoe)"/>
  </g>
  
  <!-- Tractors in bottom left -->
  <g opacity="0.7">
    <rect x="50" y="320" width="80" height="60" fill="url(#tractor)"/>
    <rect x="170" y="380" width="80" height="60" fill="url(#tractor)" transform="rotate(15, 210, 410)"/>
    <rect x="270" y="330" width="80" height="60" fill="url(#tractor)" transform="rotate(-10, 310, 360)"/>
    <rect x="100" y="450" width="80" height="60" fill="url(#tractor)" transform="rotate(5, 140, 480)"/>
    <rect x="220" y="500" width="80" height="60" fill="url(#tractor)"/>
  </g>
  
  <!-- Fishing nets in bottom right -->
  <g opacity="0.7">
    <rect x="400" y="300" width="400" height="300" fill="url(#fishing-net)"/>
  </g>
  
  <!-- Fish in bottom right -->
  <g opacity="0.7">
    <rect x="430" y="350" width="40" height="20" fill="url(#fish)"/>
    <rect x="520" y="400" width="40" height="20" fill="url(#fish)" transform="rotate(30, 540, 410)"/>
    <rect x="620" y="350" width="40" height="20" fill="url(#fish)" transform="rotate(-15, 640, 360)"/>
    <rect x="480" y="450" width="40" height="20" fill="url(#fish)" transform="rotate(45, 500, 460)"/>
    <rect x="580" y="500" width="40" height="20" fill="url(#fish)"/>
    <rect x="680" y="450" width="40" height="20" fill="url(#fish)" transform="rotate(-30, 700, 460)"/>
  </g>
  
  <!-- Small decorative elements scattered throughout -->
  <g opacity="0.4">
    <!-- Small plants -->
    <circle cx="120" cy="80" r="3" fill="#228B22"/>
    <circle cx="320" cy="150" r="3" fill="#228B22"/>
    <circle cx="450" cy="80" r="3" fill="#8B4513"/>
    <circle cx="650" cy="150" r="3" fill="#8B4513"/>
    <circle cx="120" cy="380" r="3" fill="#FF0000"/>
    <circle cx="320" cy="450" r="3" fill="#FF0000"/>
    <circle cx="450" cy="380" r="3" fill="#4682B4"/>
    <circle cx="650" cy="450" r="3" fill="#4682B4"/>
    
    <!-- Connecting dots with lines for a subtle network effect -->
    <path d="M120,80 L320,150 M450,80 L650,150 M120,380 L320,450 M450,380 L650,450" 
          stroke="#333333" stroke-width="0.5" opacity="0.2"/>
  </g>
</svg>
