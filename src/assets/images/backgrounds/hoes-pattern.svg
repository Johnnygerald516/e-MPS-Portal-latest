<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Hoe pattern -->
    <pattern id="hoe" width="80" height="80" patternUnits="userSpaceOnUse">
      <!-- Handle -->
      <path d="M40,10 L40,60" stroke="#8B4513" stroke-width="4" stroke-linecap="round"/>
      <!-- Blade -->
      <path d="M25,60 L55,60 L50,70 L30,70 Z" fill="#A9A9A9" stroke="#696969" stroke-width="1"/>
    </pattern>
    
    <!-- Small plant pattern -->
    <pattern id="plant" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20,35 C20,35 15,20 20,15 C25,20 20,35 20,35 Z" fill="#228B22" opacity="0.7"/>
      <path d="M20,35 C20,35 25,20 20,15 C15,20 20,35 20,35 Z" fill="#228B22" opacity="0.7"/>
      <path d="M20,35 C20,35 15,25 10,25 C15,30 20,35 20,35 Z" fill="#228B22" opacity="0.7"/>
      <path d="M20,35 C20,35 25,25 30,25 C25,30 20,35 20,35 Z" fill="#228B22" opacity="0.7"/>
    </pattern>
    
    <!-- Soil pattern -->
    <pattern id="soil" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#8B4513" opacity="0.1"/>
      <path d="M0,0 Q25,10 50,0 Q75,10 100,0 M0,33 Q25,43 50,33 Q75,43 100,33 M0,66 Q25,76 50,66 Q75,76 100,66 M0,100 Q25,90 50,100 Q75,90 100,100" 
            stroke="#5D2906" stroke-width="0.5" opacity="0.3" fill="none"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#F5F5DC" opacity="0.3"/>
  
  <!-- Soil background -->
  <rect width="800" height="600" fill="url(#soil)" opacity="0.3"/>
  
  <!-- Hoes pattern -->
  <rect x="50" y="50" width="80" height="80" fill="url(#hoe)" opacity="0.8"/>
  <rect x="200" y="100" width="80" height="80" fill="url(#hoe)" opacity="0.8" transform="rotate(30, 240, 140)"/>
  <rect x="350" y="50" width="80" height="80" fill="url(#hoe)" opacity="0.8" transform="rotate(-15, 390, 90)"/>
  <rect x="500" y="100" width="80" height="80" fill="url(#hoe)" opacity="0.8"/>
  <rect x="650" y="50" width="80" height="80" fill="url(#hoe)" opacity="0.8" transform="rotate(45, 690, 90)"/>
  
  <rect x="100" y="200" width="80" height="80" fill="url(#hoe)" opacity="0.8" transform="rotate(-30, 140, 240)"/>
  <rect x="300" y="250" width="80" height="80" fill="url(#hoe)" opacity="0.8"/>
  <rect x="550" y="200" width="80" height="80" fill="url(#hoe)" opacity="0.8" transform="rotate(15, 590, 240)"/>
  
  <rect x="50" y="350" width="80" height="80" fill="url(#hoe)" opacity="0.8" transform="rotate(60, 90, 390)"/>
  <rect x="250" y="400" width="80" height="80" fill="url(#hoe)" opacity="0.8"/>
  <rect x="450" y="350" width="80" height="80" fill="url(#hoe)" opacity="0.8" transform="rotate(-45, 490, 390)"/>
  <rect x="650" y="400" width="80" height="80" fill="url(#hoe)" opacity="0.8" transform="rotate(20, 690, 440)"/>
  
  <rect x="150" y="500" width="80" height="80" fill="url(#hoe)" opacity="0.8" transform="rotate(-10, 190, 540)"/>
  <rect x="400" y="500" width="80" height="80" fill="url(#hoe)" opacity="0.8"/>
  <rect x="600" y="500" width="80" height="80" fill="url(#hoe)" opacity="0.8" transform="rotate(40, 640, 540)"/>
  
  <!-- Plants -->
  <rect x="80" y="120" width="40" height="40" fill="url(#plant)" opacity="0.6"/>
  <rect x="280" y="70" width="40" height="40" fill="url(#plant)" opacity="0.6"/>
  <rect x="430" y="120" width="40" height="40" fill="url(#plant)" opacity="0.6"/>
  <rect x="580" y="70" width="40" height="40" fill="url(#plant)" opacity="0.6"/>
  <rect x="730" y="120" width="40" height="40" fill="url(#plant)" opacity="0.6"/>
  
  <rect x="180" y="270" width="40" height="40" fill="url(#plant)" opacity="0.6"/>
  <rect x="380" y="220" width="40" height="40" fill="url(#plant)" opacity="0.6"/>
  <rect x="480" y="270" width="40" height="40" fill="url(#plant)" opacity="0.6"/>
  <rect x="630" y="220" width="40" height="40" fill="url(#plant)" opacity="0.6"/>
  
  <rect x="130" y="370" width="40" height="40" fill="url(#plant)" opacity="0.6"/>
  <rect x="330" y="420" width="40" height="40" fill="url(#plant)" opacity="0.6"/>
  <rect x="530" y="370" width="40" height="40" fill="url(#plant)" opacity="0.6"/>
  <rect x="730" y="420" width="40" height="40" fill="url(#plant)" opacity="0.6"/>
  
  <rect x="80" y="520" width="40" height="40" fill="url(#plant)" opacity="0.6"/>
  <rect x="230" y="470" width="40" height="40" fill="url(#plant)" opacity="0.6"/>
  <rect x="480" y="520" width="40" height="40" fill="url(#plant)" opacity="0.6"/>
  <rect x="680" y="470" width="40" height="40" fill="url(#plant)" opacity="0.6"/>
</svg>
